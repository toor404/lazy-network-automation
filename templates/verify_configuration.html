{% extends 'base.html' %}
{% load static %}

{% block content %}
		<!-- BEGIN #content -->
		<div id="content" class="app-content">
			<div class="d-flex align-items-center mb-3">
				<div>
					<ul class="breadcrumb">
						<li class="breadcrumb-item"><a href="#">Pages</a></li>
						<li class="breadcrumb-item active">{{page}}</li>
					</ul>
					<h1 class="page-header mb-0">{{page}}</h1>
				</div>
			</div>
			<!-- BEGIN row -->
			<div class="row">
				<div class="container-fluid">
					<div class="row">
					  <div class="col-sm-12">
						<div class="card">
						  <div class="card-header">
							<h5>Result</h5>
						  </div>
						  <div class="card-body">
							<pre>{{result}}</pre>          
						  </div>
						</div>
					  </div>
					</div>
				  </div>
			</div>
			<!-- END row -->
		</div>
		<!-- END #content -->
{% endblock content %}

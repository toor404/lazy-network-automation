{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- BEGIN #content -->
<div id="content" class="app-content">
	
	<div class="card">
			<div class="tab-pane fade show active" id="allTab">
				<!-- BEGIN table -->
				<div id="datatable" class="mb-0">
					<div class="card">
						<div class="card-body">
							<table id="datatableDefault" class="table text-nowrap w-100">

								<thead>
									<tr>
										<th>#</th>
										<th>Device_id</th>
										<th>Hostname</th>
										<th>SysName</th>
										<th>Snmp Version</th>
										<th>Community</th>
									</tr>
								</thead>
								
								<tbody>
									{% for i in api %}
									<tr>
										<td>{{forloop.counter}}</td>
										<td>{{i.device_id}}</td>
										<td>{{i.hostname}}</td>
										<td>{{i.sysName}}</td>
										<td>{{i.snmpver}}</td>
										<td>{{i.community}}</td>
									</tr>
									{% endfor %}
								</tbody>
							</table>

						</div>
						<div class="card-arrow">
							<div class="card-arrow-top-left"></div>
							<div class="card-arrow-top-right"></div>
							<div class="card-arrow-bottom-left"></div>
							<div class="card-arrow-bottom-right"></div>
						</div>
					</div>
				</div>
				
				<!-- END table -->
			</div>

		<div class="card-arrow">
			<div class="card-arrow-top-left"></div>
			<div class="card-arrow-top-right"></div>
			<div class="card-arrow-bottom-left"></div>
			<div class="card-arrow-bottom-right"></div>
		</div>
	</div>
</div>
<!-- END #content -->
{% endblock content %}
